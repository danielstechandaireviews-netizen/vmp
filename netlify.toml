# Legacy host. The site is a static export (out/); the live host is Cloudflare
# Pages (see functions/ for its /api/contact). Kept working as a fallback.
[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  # Next.js 16 needs Node 20.9+.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true
